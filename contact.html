<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Contact Mikey Dunne.">
    <meta name="author" content="Mikey Dunne">
    <title>Contact | Mikey Dunne</title>
    <!-- The one external stylesheet used by every page -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Site header: full-width sage band (same on every page) -->
    <header class="site-header">
        <!-- .container centres the content and limits its width -->
        <div class="container header-inner">
            <a class="logo" href="index.html">Mikey Dunne</a>
            <nav class="site-nav" aria-label="Main navigation">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="work.html">Work</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html" aria-current="page">Contact</a></li>
                    <!-- CV opens as a PDF in a new tab -->
                    <li><a class="nav-cv" href="media/Mikey_Dunne_CV.pdf" target="_blank" rel="noopener">CV</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="container">

        <main>
            <section class="section">
                <p class="eyebrow">Contact</p>
                <h1>Get in <span class="accent-word">touch.</span></h1>
                <p>Open to design, research and consulting roles. The quickest way to reach me is by email.</p>
                <!-- Replace with your real email and LinkedIn -->
                <p><a href="mailto:mtdunnee@gmail.com">mtdunnee@gmail.com</a> · <a href="https://www.linkedin.com/">LinkedIn</a></p>
            </section>

            <!-- Contact form. Each label's "for" matches its input's "id".
                 No server is connected, so the form does not send yet (future development). -->
            <section class="section">
                <h2>Send a message</h2>
                <form class="contact-form">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>

                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" required></textarea>

                    <button type="submit">Send</button>
                </form>
            </section>
        </main>

        <!-- Site footer (same on every page) -->
        <footer class="site-footer">
            <p>&copy; 2026 Mikey Dunne</p>
            <p><a href="https://github.com/mikehub001">GitHub</a> · <a href="contact.html">Get in touch</a></p>
        </footer>

    </div>
</body>
</html>
